[project]
name = "scottish-premiership-data-dashboard"
version = "0.1.0"
description = "A Python data pipeline and interactive dashboard for Scottish Premiership football results, standings, and trends."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# This file currently declares project metadata only, for planning and packaging
# purposes (see docs/environment_configuration.md). Runtime and development
# dependencies are tracked in requirements.txt / requirements-dev.txt.

[[tool.mypy.overrides]]
# plotly ships no type stubs / py.typed marker; this isn't our code to fix.
module = ["plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = [
    # Smoke-tested (see tests/ui/), not line-coverage-tracked, per
    # docs/testing_strategy.md section 5.
    "src/dashboard/*",
    # Thin CLI entry points: argparse plumbing over already-tested
    # functions, plus live network calls docs/testing_strategy.md section
    # 5 explicitly excludes from the ingestion coverage target ("live
    # network calls excluded").
    "src/ingestion/backfill_historical.py",
    "src/ingestion/fetch_spfl_current_season.py",
    "src/processing/run_pipeline.py",
    "src/processing/run_spfl_pipeline.py",
    "src/run_daily_ingestion.py",
    # A validation report script, not an automated test gate - see
    # docs/analysis_methodology.md section 6.3.
    "src/analysis/backtest_ratings.py",
]
