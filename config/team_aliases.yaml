# Maintained team roster and name-alias mapping (see
# docs/data_ingestion.md section 4.3 and docs/environment_configuration.md
# section 6). Unlike config.yaml, this file is version-controlled: it holds
# maintained reference data, not secrets or per-environment settings.
#
# Each top-level key is the canonical_key stored on team.canonical_key.
# `aliases` lists every raw spelling seen across ingestion sources that
# should resolve to that team; an unrecognised name is treated as an error
# by src/processing/team_aliases.py rather than silently creating a
# duplicate team.
#
# The 13 teams below are every team that appeared in the football-data.co.uk
# Scottish Premiership CSVs for the 2022-23, 2023-24, and 2024-25 seasons
# (verified directly against the fetched raw data, not from memory) -
# reflecting the promotion/relegation of Dundee, Dundee United, and
# Livingston across those seasons. New teams (e.g. after future
# promotion/relegation, or aliases from a newly added source) should be
# added here as they are encountered.

aberdeen:
  display_name: "Aberdeen"
  aliases:
    - "Aberdeen"
    - "Aberdeen FC"

